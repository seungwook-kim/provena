# 기본 규칙을 그대로 쓰고, 키 없는 데모 녹화(data/demo_replay/*.jsonl)의 요청 키만 예외로 둔다.
# 녹화 줄의 "key"는 요청 내용의 sha256(64자리 16진수)이라 비밀값이 아니지만 generic-api-key 규칙에 걸린다.
# 예외는 세 조건이 모두 맞을 때만이다: 경로가 이 폴더의 jsonl, 규칙이 generic-api-key, 규칙이 잡은 글자 전체가 `key": "<64자리 16진수>"`.
# 같은 파일의 다른 필드(응답 본문 등)에 든 키는 64자리 16진수여도 계속 잡는다.
# 2026-11-16 전 설정은 `--no-git` 검사에서 이 jsonl 파일을 통째로 건너뛰었고, git 검사에서도 이 폴더의 64자리 16진수 값을 필드와 상관없이 모두 뺐다.
[extend]
useDefault = true

[[allowlists]]
description = "데모 녹화의 요청 키(sha256) 필드"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^data/demo_replay/[^/]+\.jsonl$''']
regexTarget = "match"
regexes = ['''^key": "[0-9a-f]{64}"$''']
