# 기본 규칙을 그대로 쓰고, 키 없는 데모 녹화(data/demo_replay/*.jsonl)의 요청 키만 예외로 둔다.
# 녹화 줄의 "key"는 요청 내용의 sha256(64자리 16진수)이라 비밀값이 아니지만 generic-api-key 규칙에 걸린다.
# 예외는 세 조건이 모두 맞을 때만이다: 경로가 이 폴더의 jsonl, 규칙이 generic-api-key, 규칙이 잡은 글자 전체가 `key": "<64자리 16진수>"`.
# 같은 파일의 다른 필드(응답 본문 등)에 든 키는 64자리 16진수여도 계속 잡는다.
# 2026-11-16 전 설정은 `--no-git` 검사에서 이 jsonl 파일을 통째로 건너뛰었고, git 검사에서도 이 폴더의 64자리 16진수 값을 필드와 상관없이 모두 뺐다.
[extend]
useDefault = true

[[allowlists]]
description = "데모 녹화의 요청 키(sha256) 필드"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^data/demo_replay/[^/]+\.jsonl$''']
regexTarget = "match"
regexes = ['''^key": "[0-9a-f]{64}"$''']

# 평가셋 v2 50건의 CI 재생 녹화(evals/ci_replay_v2/*.jsonl, evals/ci_current_eval.py --require-v2)도 같은 형식의 요청 키를 쓴다. 조건은 위와 같고 경로만 다르다.
# 이 파일은 커서 `gitleaks dir`이 나눠 읽는데, 나눈 경계가 키 값 가운데에 걸리면 잡힌 글자가 `key": "<16진수 일부>`로 잘린다. 그래서 끝 따옴표 없이 16진수만 이어지는 경우도 받는다(16진수 외 글자가 섞이면 계속 잡는다)
[[allowlists]]
description = "평가셋 v2 50건 CI 재생 녹화의 요청 키(sha256) 필드"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^evals/ci_replay_v2/[^/]+\.jsonl$''']
regexTarget = "match"
regexes = ['''^key": "[0-9a-f]{10,64}"?$''']
