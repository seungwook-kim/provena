# G2: `docker compose up` 한 줄로 전체 서비스가 10분 안에 떠야 합니다.
# 평가자에게는 API 키가 없으므로 기본값은 데모 모드(DEMO_MODE=1)입니다.
# 필요 없는 서비스는 지우고, 필요한 것(redis 등)은 추가하세요.
#
# 로컬 데모 계정 값은 .env.example에서 읽고, .env가 있으면 그 값이 이깁니다. 서명 키(AUTH_SECRET)는 저장소에 두지 않습니다:
# 비워 두면 로컬 데모 모드에서만 실행할 때마다 무작위로 만듭니다(backend/main.py). 배포(Cloud Run) 값은 저장소에 두지 않습니다.
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"  # 8000번이 이미 쓰이고 있으면 .env에 API_PORT=8001처럼 적습니다
    # .env가 없어도 뜹니다 (키가 필요 없는 데모 모드). 뒤에 적은 파일이 앞 파일 값을 덮습니다
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      DATABASE_URL: postgresql://app:app@db:5432/app
      # 로컬 데모 모드: 이 둘이 모두 켜져 있을 때만 users 테이블을 만들고 데모 계정 2개를 시드하며, 쿠키 Secure를 끕니다(http://localhost)
      PROVENA_ENV: ${PROVENA_ENV:-local}
      PROVENA_DEV_MODE: ${PROVENA_DEV_MODE:-1}
      # 검색 모델·BM25를 시작할 때 백그라운드로 올린다(backend/main.py). 색인이 없으면 경고만 남고 서버는 뜬다.
      # 로컬 데모는 기다리지 않는다(G2 시작 시간). 운영의 기본값(비우면 시작 때 기다려 끝냄)과 다르다
      SEARCH_WARMUP: ${SEARCH_WARMUP:-background}
    depends_on:
      db:
        condition: service_healthy
      # 색인 적재가 끝난 뒤 뜬다('켜졌다'와 '준비됐다'는 다르다). 색인이 없으면 loader는 건너뛰고 성공으로 끝난다
      loader:
        condition: service_completed_successfully
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64

  loader:
    # 검색 색인(data/index/)을 DB에 한 번 적재한다(backend/rag/retrieve/load_snapshot.py, docs/specs/search.md).
    # data/index/가 없으면(새로 clone하면 연결한 폴더가 비어 있다) 커밋한 data/index.tar.gz를 풀어 meta.json sha256과 대조하고,
    # 압축 파일도 없으면 INDEX_URL·INDEX_SHA256으로 받고, 다 없으면 건너뛴다(색인 없이도 compose가 뜨게).
    # 같은 스냅샷이 이미 적재돼 있으면 몇 초 안에 끝난다
    build: .
    command: ["python", "-m", "backend.rag.retrieve.load_snapshot"]
    # 이미지 기본 사용자는 app(root 아님)이다. 연결한 ./data/index는 호스트 폴더라(Linux에서 없으면 Docker가 root 소유로 만든다)
    # app이 못 쓸 수 있으므로, 한 번 돌고 끝나는 적재 작업만 root로 돈다. api 서비스는 app으로 돈다
    user: root
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    volumes:
      - ./data/index:/app/data/index
    depends_on:
      db:
        condition: service_healthy

  db:
    # pgvector 확장이 들어 있는 Postgres. 스냅샷 적재는 db/ 아래에 SQL로 추가하세요.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 새 DB의 첫 기동에서는 공식 이미지가 db/ 초기화 스크립트를 돌리는 동안(약 15~40초) 임시 서버를 띄운다.
      # 이 서버는 유닉스 소켓만 열고 TCP는 받지 않으므로, 소켓 검사(-h 생략)는 이때 healthy로 잘못 판정한다.
      # 다른 컨테이너는 TCP로 접속하니 같은 방식(-h 127.0.0.1)으로 검사해야 초기화가 끝난 진짜 서버만 healthy가 된다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 3s
      timeout: 3s
      # 초기화(최대 약 40초)와 느린 PC를 감안해 약 2분까지 기다린다
      retries: 40
      start_period: 10s

volumes:
  pgdata:
