openapi: 3.1.0
info:
  title: 3차 프로젝트 API
  version: 0.1.0
servers:
- url: /
paths:
  /admin/eval/review:
    post:
      operationId: eval_review_admin_eval_review_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalReviewRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Eval Review Admin Eval Review Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Eval Review
      x-content-type: application/json
      x-accepts:
      - application/json
  /admin/signup-requests:
    get:
      operationId: list_signup_requests_admin_signup_requests_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupRequestList"
          description: Successful Response
        "401":
          description: Authentication required
        "403":
          description: Owner-admin or CSRF authorization failed
        "503":
          description: Signup approval storage unavailable
      summary: List Signup Requests
      x-accepts:
      - application/json
  /admin/signup-requests/by-id/{request_id}/reset-verification:
    post:
      description: Owner-admin only; requires a valid CSRF token. Clears the verification
        code and resets the attempt and send counters of an unverified pending email
        signup request so a new code can be issued.
      operationId: reset_signup_verification_admin_signup_requests_by_id__request_id__reset_verification_post
      parameters:
      - explode: false
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupVerificationResetResult"
          description: Successful Response
        "401":
          description: Authentication required
        "403":
          description: Owner-admin or CSRF authorization failed
        "404":
          description: Signup request not found
        "409":
          description: Verification reset is unavailable for this request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "503":
          description: Signup approval storage unavailable
      summary: Reset Signup Verification
      x-accepts:
      - application/json
  /admin/signup-requests/by-id/{request_id}/{action}:
    post:
      description: Owner-admin only; requires a valid CSRF token. action must be approve
        or reject.
      operationId: review_signup_request_by_id_admin_signup_requests_by_id__request_id___action__post
      parameters:
      - explode: false
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: integer
        style: simple
      - explode: false
        in: path
        name: action
        required: true
        schema:
          title: Action
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupReviewByIdResult"
          description: Successful Response
        "401":
          description: Authentication required
        "403":
          description: Owner-admin or CSRF authorization failed
        "404":
          description: Signup request not found
        "409":
          description: Email verification is required
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "503":
          description: Signup approval storage unavailable
      summary: Review Signup Request By Id
      x-accepts:
      - application/json
  /admin/signup-requests/{login_id}/{action}:
    post:
      operationId: review_signup_request_admin_signup_requests__login_id___action__post
      parameters:
      - explode: false
        in: path
        name: login_id
        required: true
        schema:
          title: Login Id
          type: string
        style: simple
      - explode: false
        in: path
        name: action
        required: true
        schema:
          title: Action
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Review Signup Request Admin Signup Requests  Login
                  Id   Action  Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Review Signup Request
      x-accepts:
      - application/json
  /admin/sync:
    post:
      description: 증분 수집 수동 실행(C-14). 관리자만. 기본은 dry_run=true(시작하지 않고 계획만). dry_run=false는
        501(실제 실행 방식 미정).
      operationId: post_sync_admin_sync_post
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/SyncBody"
              nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Post Sync Admin Sync Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Post Sync
      x-content-type: application/json
      x-accepts:
      - application/json
  /admin/users:
    get:
      operationId: list_users_admin_users_get
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Users
      x-accepts:
      - application/json
  /admin/users/{login_id}/promote:
    post:
      operationId: promote_admin_users__login_id__promote_post
      parameters:
      - explode: false
        in: path
        name: login_id
        required: true
        schema:
          title: Login Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Promote Admin Users  Login Id  Promote Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Promote
      x-accepts:
      - application/json
  /admin/users/{login_id}/revoke:
    post:
      operationId: revoke_admin_users__login_id__revoke_post
      parameters:
      - explode: false
        in: path
        name: login_id
        required: true
        schema:
          title: Login Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Revoke Admin Users  Login Id  Revoke Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Revoke
      x-accepts:
      - application/json
  /approvals:
    get:
      operationId: list_approvals_approvals_get
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Approvals
      x-accepts:
      - application/json
  /approvals/{approval_id}:
    get:
      description: |-
        승인 건 하나의 상태와 그래프 재개 기록(`resume_count`, `duplicate_ignored_count`, `last_resumed_at`, `last_resume_result`). 끝난 건도 읽는다.
        결정 응답은 같은 결정을 다시 보내도 같게 유지하므로 재개 횟수는 여기서 읽는다.
      operationId: get_approval_approvals__approval_id__get
      parameters:
      - explode: false
        in: path
        name: approval_id
        required: true
        schema:
          title: Approval Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalView"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Approval
      x-accepts:
      - application/json
    post:
      operationId: decide_approvals__approval_id__post
      parameters:
      - explode: false
        in: path
        name: approval_id
        required: true
        schema:
          title: Approval Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Decide
      x-accepts:
      - application/json
  /auth/csrf:
    get:
      operationId: csrf_auth_csrf_get
      responses:
        "204":
          description: Successful Response
      summary: Csrf
      x-accepts:
      - application/json
  /auth/google/callback:
    get:
      operationId: google_callback_auth_google_callback_get
      parameters:
      - explode: true
        in: query
        name: code
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: state
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: error
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "303":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Google Callback
      x-accepts:
      - application/json
  /auth/google/start:
    get:
      operationId: google_start_auth_google_start_get
      responses:
        "303":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Google Start
      x-accepts:
      - application/json
  /auth/login:
    post:
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Successful Response
        "403":
          description: "Signup request is pending approval or rejected, or (error\
            \ code signup_unverified) its email verification is not finished yet"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Login
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/logout:
    post:
      operationId: logout_auth_logout_post
      responses:
        "204":
          description: Successful Response
      summary: Logout
      x-accepts:
      - application/json
  /auth/signup:
    post:
      description: "Email signup. An unverified pending request for the same email\
        \ is replaced only after its code expired more than 24 hours ago (STALE_UNVERIFIED_SIGNUP_HOURS);\
        \ until then the same email returns 409. Verified or approved requests and\
        \ existing accounts (email compared case-insensitively) return 409. A rejected\
        \ request does not block signing up again. The 201 body has code verification_sent\
        \ (email: enter the emailed code, then wait for approval) or approval_pending\
        \ (non-email ID), and a message; signing up does not log the user in."
      operationId: signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                  type: string
                title: Response Signup Auth Signup Post
                type: object
          description: Successful Response
        "409":
          description: "Email already has an account, or a non-stale pending request\
            \ or an approved request exists"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "503":
          description: "Signup storage unavailable, or the verification email could\
            \ not be sent (the pending request is removed so the same email can sign\
            \ up again)"
      summary: Signup
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/signup/resend:
    post:
      description: "Resends only for pending, unverified email signup requests. Missing,\
        \ completed, and rate-limited requests are intentionally returned as status\
        \ unavailable."
      operationId: resend_signup_auth_signup_resend_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupResendRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                  type: string
                title: Response Resend Signup Auth Signup Resend Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "503":
          description: Email verification storage or provider unavailable (also returned
            when EMAIL_PROVIDER is not configured or delivery fails)
      summary: Resend Signup
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/signup/verify:
    post:
      description: Requires a valid CSRF token and a six-digit verification code.
      operationId: verify_signup_auth_signup_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerificationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                  type: string
                title: Response Verify Signup Auth Signup Verify Post
                type: object
          description: Successful Response
        "400":
          description: Incorrect verification code
        "410":
          description: Verification code expired
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          description: Verification attempts exceeded
        "503":
          description: Email verification storage unavailable
      summary: Verify Signup
      x-content-type: application/json
      x-accepts:
      - application/json
  /changes:
    get:
      operationId: list_changes_changes_get
      parameters:
      - explode: true
        in: query
        name: since
        required: false
        schema:
          maxLength: 10
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 1000000
          minimum: 0
          title: Offset
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesResponse"
          description: 화면 주소를 직접 열면 HTML이 온다.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List Changes
      x-accepts:
      - application/json
  /changes/monitoring:
    get:
      operationId: get_monitoring_changes_monitoring_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Get Monitoring Changes Monitoring Get
                type: object
          description: Successful Response
      summary: Get Monitoring
      x-accepts:
      - application/json
    put:
      operationId: put_monitoring_changes_monitoring_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Put Monitoring Changes Monitoring Put
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Put Monitoring
      x-content-type: application/json
      x-accepts:
      - application/json
  /changes/{event_id}:
    get:
      operationId: get_change_changes__event_id__get
      parameters:
      - explode: false
        in: path
        name: event_id
        required: true
        schema:
          title: Event Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Change
      x-accepts:
      - application/json
  /chat:
    post:
      description: "`{thread_id?, message}` -> SSE로 `AgentEvent`. 승인 대기 중인 thread의\
        \ 새 질문은 409 `approval_pending`."
      operationId: chat_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Chat
      x-content-type: application/json
      x-accepts:
      - application/json
  /decision-tables:
    get:
      operationId: list_decision_tables_decision_tables_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DecisionTableItem"
                title: Response List Decision Tables Decision Tables Get
                type: array
                default: null
          description: Successful Response
      summary: List Decision Tables
      x-accepts:
      - application/json
  /decision-tables/convert:
    post:
      operationId: start_convert_decision_tables_convert_post
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalView"
          description: Successful Response
      summary: Start Convert
      x-accepts:
      - application/json
  /decision-tables/run:
    post:
      operationId: run_by_task_type_decision_tables_run_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: Successful Response
      summary: Run By Task Type
      x-accepts:
      - application/json
  /decision-tables/{table_id}/run:
    post:
      operationId: run_table_decision_tables__table_id__run_post
      parameters:
      - explode: false
        in: path
        name: table_id
        required: true
        schema:
          title: Table Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Run Table
      x-accepts:
      - application/json
  /health:
    get:
      description: 평가자와 배포 환경이 서비스 상태를 확인하는 곳. 지우지 마세요.
      operationId: health_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      x-accepts:
      - application/json
  /impact-preview:
    post:
      operationId: impact_preview_impact_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Impact Preview Impact Preview Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Impact Preview
      x-content-type: application/json
      x-accepts:
      - application/json
  /maintenance-candidates:
    get:
      operationId: list_candidates_maintenance_candidates_get
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - needed
          - not_needed
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response List Candidates Maintenance Candidates Get
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List Candidates
      x-accepts:
      - application/json
  /maintenance-candidates/{candidate_id}:
    post:
      operationId: decide_candidate_maintenance_candidates__candidate_id__post
      parameters:
      - explode: false
        in: path
        name: candidate_id
        required: true
        schema:
          title: Candidate Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateDecision"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Decide Candidate Maintenance Candidates  Candidate
                  Id  Post
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Decide Candidate
      x-content-type: application/json
      x-accepts:
      - application/json
  /me:
    get:
      operationId: me_me_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Successful Response
      summary: Me
      x-accepts:
      - application/json
  /me/memory:
    delete:
      operationId: memory_delete_me_memory_delete
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Memory Delete Me Memory Delete
                type: object
          description: Successful Response
      summary: Memory Delete
      x-accepts:
      - application/json
    get:
      operationId: memory_get_me_memory_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Memory Get Me Memory Get
                type: object
          description: Successful Response
      summary: Memory Get
      x-accepts:
      - application/json
    patch:
      operationId: memory_patch_me_memory_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  nullable: true
                title: Response Memory Patch Me Memory Patch
                type: object
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Memory Patch
      x-content-type: application/json
