components:
  schemas:
    ApprovalView:
      description: |-
        `ApprovalItem`과 같은 이름에 승인 화면에 필요한 값을 더했다. 결정표 건은 초안과 셀 대조표, 쟁점표 건은 `issue_table`, 팀 실패 알림 건은 `failed_teams`다.
        `save_failed`는 결정을 받았지만 저장에 실패해 같은 결정을 다시 보내야 하는 건이고, 팀 실패 알림이면 `resolution`에 접수된 행동이 보인다.
      example:
        approval_id: approval_id
        comparison:
          key: ""
        created_at: 2000-01-23T04:56:07.000+00:00
        decided_at: 2000-01-23T04:56:07.000+00:00
        decided_by: decided_by
        draft:
        - key: ""
        - key: ""
        duplicate_ignored_count: 0
        failed_teams:
        - key: ""
        - key: ""
        issue_table:
          key: ""
        kind: kind
        last_resume_result: last_resume_result
        last_resumed_at: 2000-01-23T04:56:07.000+00:00
        rejected_resume: rejected_resume
        resolution: resolution
        resume_count: 6
        save_failed: false
        status: status
        summary: summary
        table_id: table_id
      properties:
        approval_id:
          title: Approval Id
          type: string
        comparison:
          additionalProperties: true
          nullable: true
          type: object
        created_at:
          format: date-time
          title: Created At
          type: string
        decided_at:
          format: date-time
          nullable: true
          type: string
        decided_by:
          nullable: true
          type: string
        draft:
          items:
            additionalProperties: true
            nullable: true
            type: object
          nullable: true
          type: array
          default: null
        duplicate_ignored_count:
          default: 0
          title: Duplicate Ignored Count
          type: integer
        failed_teams:
          items:
            additionalProperties: true
            type: object
          nullable: true
          type: array
          default: null
        issue_table:
          additionalProperties: true
          nullable: true
          type: object
        kind:
          title: Kind
          type: string
        last_resume_result:
          nullable: true
          type: string
        last_resumed_at:
          format: date-time
          nullable: true
          type: string
        rejected_resume:
          nullable: true
          type: string
        resolution:
          nullable: true
          type: string
        resume_count:
          default: 0
          title: Resume Count
          type: integer
        save_failed:
          default: false
          title: Save Failed
          type: boolean
        status:
          nullable: true
          type: string
        summary:
          title: Summary
          type: string
        table_id:
          nullable: true
          type: string
      required:
      - approval_id
      - created_at
      - kind
      - summary
      title: ApprovalView
    CandidateDecision:
      additionalProperties: false
      example:
        status: needed
      properties:
        status:
          enum:
          - needed
          - not_needed
          title: Status
          type: string
      required:
      - status
      title: CandidateDecision
    ChangeItem:
      description: '`GET /changes`의 `items` 한 건(`change_json`의 반환과 같은 칸). 명세용이며 응답을
        걸러내지 않는다.'
      example:
        article: article
        change_type: change_type
        created_at: created_at
        event_id: event_id
        impacted_answer_count: 6
        new_version_date: new_version_date
        old_version_date: old_version_date
        page_title: page_title
        rule_seq: 1
        source_url: source_url
        status: status
      properties:
