    ChangesResponse:
      description: '`GET /changes` 응답 칸(명세용). `total`·`counts`는 저장소가 못 세면 null이다.'
      example:
        counts:
          key: 0
        items:
        - article: article
          change_type: change_type
          created_at: created_at
          event_id: event_id
          impacted_answer_count: 6
          new_version_date: new_version_date
          old_version_date: old_version_date
          page_title: page_title
          rule_seq: 1
          source_url: source_url
          status: status
        - article: article
          change_type: change_type
          created_at: created_at
          event_id: event_id
          impacted_answer_count: 6
          new_version_date: new_version_date
          old_version_date: old_version_date
          page_title: page_title
          rule_seq: 1
          source_url: source_url
          status: status
        last_run: ""
        monitoring: active
        more: true
        total: 5
      properties:
        counts:
          additionalProperties:
            type: integer
          nullable: true
          type: object
        items:
          items:
            $ref: "#/components/schemas/ChangeItem"
          title: Items
          type: array
          default: null
        last_run:
          allOf:
          - $ref: "#/components/schemas/ChangeLastRun"
          nullable: true
        monitoring:
          enum:
          - active
          - paused
          title: Monitoring
          type: string
        more:
          title: More
          type: boolean
        total:
          nullable: true
          type: integer
      required:
      - counts
      - items
      - last_run
      - monitoring
      - more
      - total
      title: ChangesResponse
    ChatRequest:
