        new_version_date:
          nullable: true
          type: string
        old_version_date:
          nullable: true
          type: string
        page_title:
          nullable: true
          type: string
        rule_seq:
          title: Rule Seq
          type: integer
        source_url:
          nullable: true
          type: string
        status:
          nullable: true
          type: string
      required:
