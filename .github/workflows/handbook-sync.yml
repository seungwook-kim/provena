# 증분 수집 정시 실행 (가산 자동화, docs/specs/incremental.md). 강사 템플릿(rag 3주차 fixtures/nb_agent11_workflow.json) 방식.
# 정시 실행(schedule)은 기본 브랜치(main)에 있는 이 파일만 돈다. 멈출 때는 Actions 화면의 "Disable workflow".
# 필요한 값: secrets.DATABASE_URL(운영 DB, 직접 연결 또는 session mode), secrets.SYNC_ALERT_WEBHOOK(디스코드, 없으면 알림 꺼짐을 로그에),
#           vars.EMBED_MODEL(색인 장부와 같은 모델. 비우면 코드 기본값)
name: handbook-sync

on:
  schedule:
    - cron: "7 18 * * *"            # 매일 UTC 18:07 = 한국 03:07. cron은 UTC다. 정각(고부하)을 피해 분을 비튼다
  workflow_dispatch: {}             # 손으로 한 번 돌려 보는 버튼

concurrency:
  group: handbook-sync              # 같은 그룹의 실행은 동시에 둘이 돌지 않는다
  cancel-in-progress: false         # 돌고 있는 실행을 중간에 끊지 않는다

permissions:
  contents: read                    # 저장소에는 쓰지 않는다(증거는 DB sync_runs + 이 실행의 로그)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30             # 잠정. 첫 수동 실행에서 걸린 시간을 재고 고친다
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # 토큰을 git 설정에 남기지 않는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 핸드북 캐시·모델 캐시 되살리기
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/provena/handbook
            ~/.cache/huggingface
          key: handbook-sync-${{ github.run_id }}
          restore-keys: handbook-sync-
      - run: pip install -r backend/requirements.txt
      - name: 증분 수집 한 번
        id: sync
        run: python -m backend.rag.ingest.schedule --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL }}
          HF_HUB_OFFLINE: "0"         # 새 글이 있을 때만 모델을 받는다(고정 판)
      - name: 삭제 보류 알림
        if: success() && steps.sync.outputs.held != ''   # 성공이지만 목록이 불완전해 삭제를 미룬 날(실패 아님)
        env:
          SYNC_ALERT_WEBHOOK: ${{ secrets.SYNC_ALERT_WEBHOOK }}
          HELD: ${{ steps.sync.outputs.held }}
          REASONS: ${{ steps.sync.outputs.reasons }}
        run: |
          if [ -z "$SYNC_ALERT_WEBHOOK" ]; then echo "알림 꺼짐: SYNC_ALERT_WEBHOOK 없음"; exit 0; fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -H "Content-Type: application/json" \
               -d "{\"content\": \"handbook-sync 삭제 보류 ${HELD}쪽 (목록 불완전: ${REASONS}) — 다음 실행에서 다시 확인 ${url}\"}" \
               "$SYNC_ALERT_WEBHOOK"
      - name: 실패 알림
        if: failure()                 # 파이썬이 중간에 죽어도 이 단계는 돈다
        env:
          SYNC_ALERT_WEBHOOK: ${{ secrets.SYNC_ALERT_WEBHOOK }}
        run: |
          if [ -z "$SYNC_ALERT_WEBHOOK" ]; then echo "알림 꺼짐: SYNC_ALERT_WEBHOOK 없음"; exit 0; fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -H "Content-Type: application/json" \
               -d "{\"content\": \"handbook-sync 실패 (${GITHUB_EVENT_NAME}) — ${url}\"}" "$SYNC_ALERT_WEBHOOK"
