# PR마다 테스트를 돌립니다. 동결한 평가셋이 바뀌면 여기서 실패합니다.
# Actions 무료 한도가 있으니 무거운 평가 전체가 아니라 샘플만 돌리세요.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - name: 평가 점수 비교 (커밋된 결과 파일만, 키·네트워크 없음)
        run: python evals/ci_compare.py
